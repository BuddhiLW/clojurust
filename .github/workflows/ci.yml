name: CI

on:
  # `staging` is this fork's integration trunk: our unmerged work is merged
  # there, topic branches are cut from there, and upstream PRs and local
  # releases are taken from it. That only means anything if it is verified,
  # and a merge is exactly where two independently green branches stop being
  # green, so staging is gated on the same job as main rather than a lighter
  # one.
  pull_request:
    branches: [main, staging]
  # Releases are cut nightly rather than per-merge, so main is verified here on
  # every push to catch a broken merge before the nightly tries to publish it.
  push:
    branches: [main, staging]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build, test, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Clojure Tests
        run: cargo run -p cljrs compile -o test-suite --test ./clojure-test-suite/test && CLJRS_GC_STATS=- ./test-suite

      # Both legs: they fail differently, and the AOT one cannot be gated from
      # cargo. Rationale in memory 20260910030000-cljrs-selfhosted-ci.
      - name: cljrs self-hosted tests (interpreter)
        run: cargo run -p cljrs test --src-path ./tests/cljrs

      - name: cljrs self-hosted tests (AOT compile and run)
        run: cargo run -p cljrs compile -o cljrs-tests --test ./tests/cljrs && CLJRS_GC_STATS=- ./cljrs-tests

  wasm:
    name: WASM build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build cljrs-wasm
        run: wasm-pack build crates/cljrs-wasm --target web --no-typescript --release
