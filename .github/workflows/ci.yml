name: CI

on:
  # `staging` is this fork's integration trunk: our unmerged work is merged
  # there, topic branches are cut from there, and upstream PRs and local
  # releases are taken from it. That only means anything if it is verified,
  # and a merge is exactly where two independently green branches stop being
  # green, so staging is gated on the same job as main rather than a lighter
  # one.
  pull_request:
    branches: [main, staging]
  # Releases are cut nightly rather than per-merge, so main is verified here on
  # every push to catch a broken merge before the nightly tries to publish it.
  push:
    branches: [main, staging]

env:
  CARGO_TERM_COLOR: always

# The gate runs on pinned inputs, so a run is red only when the tree is.
# A floating `stable` turned every branch red twice with no code change: a new
# lint deprecation failed clippy, and new codegen exposed a latent memory bug.
# Bump the toolchain, the runner image and wasm-pack here, in a commit of
# their own, so that what a bump breaks is seen as the bump's doing.
jobs:
  ci:
    name: Build, test, lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      # `--locked`: build what Cargo.lock says, and fail if it is stale.
      - name: Check
        run: cargo check --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Clojure Tests
        run: cargo run --locked -p cljrs compile -o test-suite --test ./clojure-test-suite/test && CLJRS_GC_STATS=- ./test-suite

      # Both legs: they fail differently, and the AOT one cannot be gated from
      # cargo. Rationale in memory 20260909235156-7104b028.
      - name: cljrs self-hosted tests (interpreter)
        run: cargo run --locked -p cljrs test --src-path ./tests/cljrs

      - name: cljrs self-hosted tests (AOT compile and run)
        run: cargo run --locked -p cljrs compile -o cljrs-tests --test ./tests/cljrs && CLJRS_GC_STATS=- ./cljrs-tests

  wasm:
    name: WASM build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Build cljrs-wasm
        run: wasm-pack build crates/cljrs-wasm --target web --no-typescript --release
