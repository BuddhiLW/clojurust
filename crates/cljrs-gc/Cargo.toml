[package]
name = "cljrs-gc"
version = "0.1.0"
edition = "2024"
description = "Tracing garbage collector for clojurust"
license.workspace = true
repository.workspace = true

[features]
# Replace GC machinery with region-based allocation (no pauses, no Trace overhead).
no-gc = []

[dependencies]
num-bigint   = { workspace = true }
bigdecimal   = { workspace = true }
num-rational = { workspace = true }
tracing       = { workspace = true }

# Asks the OS for the installed memory (see src/sysmem.rs).  Windows needs no
# crate for it, and the wasm build uses a fixed 64 MB heap limit instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"