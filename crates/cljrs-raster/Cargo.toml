[package]
name = "cljrs-raster"
version = "0.1.0"
edition = "2024"
description = "2D vector rasterization for Clojurust, backed by tiny-skia"
license.workspace = true
repository.workspace = true

# A plain rlib. This is an *extension* (statically linked into `cljrs`, like
# `cljrs-net` and `cljrs-charset`), not a dynamically loaded *plugin* like
# `cljrs-base64`. Plugins export an unmangled `cljrs_init`, and a link may hold
# exactly one of those; since Cargo unifies features across a whole build, no
# feature gate can keep two of them apart under `cargo build --workspace`.
# Extensions register through `init`/`register` instead and compose freely.

[features]
default = ["regex-full", "deps"]
regex-full  = ["cljrs-value/regex-full", "cljrs-runtime/regex-full", "cljrs-interop/regex-full"]
small-regex = ["cljrs-value/small-regex", "cljrs-runtime/small-regex", "cljrs-interop/small-regex"]
deps = ["cljrs-runtime/deps", "cljrs-interop/deps"]
[dependencies]
cljrs-interop = { workspace = true }
cljrs-gc      = { workspace = true }
cljrs-value   = { workspace = true }
cljrs-runtime = { workspace = true }
tiny-skia     = "0.11"

[dev-dependencies]
cljrs-stdlib  = { workspace = true }
cljrs-reader  = { workspace = true }
tempfile      = "3"
